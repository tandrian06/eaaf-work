services:
  work:
    build: .
    environment:
      EAAF_GATEWAY_URL: "${EAAF_GATEWAY_URL:?Set the Core API URL reachable from Work}"
    ports:
      - "127.0.0.1:${EAAF_WORK_PORT:-8001}:8001"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
